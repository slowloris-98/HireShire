settings:
  enable_applier: true              # run the applier phase after each pipeline run (orchestrator/dashboard default; --apply still forces on)
  dry_run: false                    # CRITICAL: set to false to actually submit applications
  applied_dir: data/applied         # on-disk home for screenshots/ (records go to the applied table)
  db_path: data/hireshire.db        # shared SQLite datastore — reads shortlisted matches, writes the applied table
  resume_path: data/resume_projects/Udayan_Resume.pdf
  headless: false                  # set to false to watch the browser while debugging
  inter_job_delay_s: 10            # seconds to wait between applications
  max_steps: 40                    # max browser-use agent steps per job

  # Career portals that require an account login before showing the form — the
  # applier cannot get past those, so skip them rather than burn max_steps.
  # Their tuned resumes are still produced; apply to these manually.
  exclude_companies: [google, apple, meta, microsoft, intuit]

  # Your details — used to fill standard application fields
  first_name: Udayan
  last_name: Atreya
  email: udayan.atreya@gmail.com
  phone: "6693406033"

  generate_cover_letter: false
  model: gpt-4o-mini               # LLM for answer generation and browser agent
